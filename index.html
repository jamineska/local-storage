<!DOCTYPE html>
<html lang="es-ES">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>Gestor de Tienda de Ropa</title>
</head>
<body>

    <div class="container">
        <h2>Carrito</h2>
        <!--Formulario de entrada de productos-->
    <form id="formulario-producto">
        <input type="text" id="nombre-producto" placeholder="Escribe una prenda..." required>
            <button type="submit">Agregar Producto</button>
    </form>
    <!--Tabla de productos separada porcolumnas con etiquetas th-->
     <table>
        <thead>
            <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="lista-productos">
            <!--Las filas se generarán dinamicamente con JavaScript-->
        </tbody>
     </table>    
    </div>

    <!--contacto y pie de página-->
    <footer class="fullContainer">
        <p>&copy; 2026 Registrate a nuestro Club. Todos los derechos reservados.</p>
        <p><a href="mailto:contacto@mipaginaweb.com">contacto@mipaginaweb.com</a></p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
